<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mushroom ID: daily lookalike training</title>
  <meta name="description" content="A daily mushroom identification game. Twenty pairs of lookalike mushrooms: can you tell the chanterelle from the jack-o'-lantern?">
  <meta name="theme-color" content="#2f5d3a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn" data-action="help" aria-label="How to play" title="How to play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.9"/><circle cx="12" cy="17.2" r=".6" class="fill"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="Mushroom ID home">
        <img src="favicon.svg" alt="" width="28" height="28">
        <span>Mushroom ID</span>
      </a>
      <div class="topbar-right">
        <a class="icon-btn" href="#/guide" aria-label="Field guide" title="Field guide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14C9.5 18 6.5 18 4 19.5z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>
        </a>
        <button class="icon-btn" data-action="stats" aria-label="Statistics" title="Statistics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">Gathering mushrooms…</p>
  </main>

  <footer class="site-footer">
    <p><strong>For practice only.</strong> Never eat a wild mushroom based on photos, an app or a game. Check with an experienced local expert.</p>
    <p><a href="#/credits">Photo credits</a> · <a href="#/about">About &amp; sources</a></p>
  </footer>

  <dialog id="modal">
    <div class="modal-inner">
      <button class="icon-btn modal-close" data-action="close-modal" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <div id="lightbox" hidden>
    <img alt="">
    <button class="icon-btn" data-action="close-lightbox" aria-label="Close enlarged photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
